# This is an example .goreleaser.yml file with some sensible defaults.
# Make sure to check the documentation at https://goreleaser.com

# The lines below are called `modelines`. See `:help modeline`
# Feel free to remove those if you don't want/need to use them.
# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# vim: set ts=2 sw=2 tw=0 fo=cnqoj

version: 2

before:
  hooks:
    # You may remove this if you don't use go modules.
    - go mod tidy
    # you may remove this if you don't need go generate
    - go generate ./...

builds:
  # linux/amd64 is built natively (the release host), so cgo stays on: full
  # call support (mic capture via malgo, playback via oto) needs it - see
  # call/audio_cgo.go.
  - id: linux-amd64
    main: ./...
    env:
      - CGO_ENABLED=1
    goos:
      - linux
    goarch:
      - amd64

  # linux/arm64 and linux/386, like Windows/macOS below, are cross-compiled
  # from the amd64 release host with no matching cgo toolchain (no
  # aarch64-linux-gnu-gcc, no gcc-multilib) wired up, so cgo is off and
  # call/audio_nocgo.go's stub kicks in: voice calls are unavailable in
  # these builds.
  - id: linux-cross
    main: ./...
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - arm64
      - "386"

  - id: windows
    main: ./...
    env:
      - CGO_ENABLED=0
    goos:
      - windows
    goarch:
      - arm64
      - amd64
      - "386"

  - id: darwin
    main: ./...
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
    goarch:
      - arm64
      - amd64

archives:
  - formats: [tar.gz]
    # this name template makes the OS and Arch compatible with the results of `uname`.
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    # use zip for windows archives
    format_overrides:
      - goos: windows
        formats: [zip]

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

release:
  footer: >-

    ---

    Released by [GoReleaser](https://github.com/goreleaser/goreleaser).
