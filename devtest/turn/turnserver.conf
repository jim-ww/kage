# Throwaway local coturn config for exercising call/Jingle ICE against a
# real STUN/TURN server (see call/peer.go's NewPeerConnection, which only
# configures a public STUN server today - no TURN relay). Loopback-only,
# plaintext long-term credential, not for anything but local dev/test.
listening-port=3478
listening-ip=127.0.0.1
relay-ip=127.0.0.1
external-ip=127.0.0.1

# Relay port range - kept small since this is single-machine, single-test
# use, not a real deployment.
min-port=49160
max-port=49200

fingerprint
lt-cred-mech
realm=localhost
user=kage:kagepw

# No TLS/DTLS listener - matches the plaintext UDP-only STUN server kage
# already uses (stun:stun.l.google.com:19302), and avoids needing a cert
# here beyond the ones devtest/prosody/ already manages for XMPP.
no-tls
no-dtls

no-cli
verbose
log-file=stdout
